# The small Workflow's Ticket Steps, for one Ticket of a Goal that names
# another Workflow: `vago ticket add <goal> <ticket> --workflow small-ticket`.
# A Ticket's Workflow can't have Goal Steps, so the Goal's own Workflow keeps
# them (the PR description and ready-for-review). Keep the Steps below in step
# with small.toml.

harness = "claude-code"
model = "claude-opus-5-5"
idle_timeout = "10m"      # how long the Harness may print nothing before the Run fails

[[steps]]
id = "branch"
name = "New branch"
type = "shell"
run = "sh .vago/scripts/branch.sh"

[[steps]]
id = "implement"
name = "Build"
type = "agent"
prompt = "prompts/small-implement.md"

[[steps]]
id = "check"
name = "Checks"
type = "shell"
run = "sh .vago/scripts/check.sh"
on_fail = "continue"              # review reads a failed check and fixes it

[[steps]]
id = "review"
name = "Review"
type = "agent"
prompt = "prompts/small-review.md"

[[steps]]
id = "goal-review"
name = "Goal review"
type = "agent"
prompt = "prompts/goal-review.md"
when = "last-ticket"              # skipped on every other Ticket

[[steps]]
id = "final-check"
name = "Final checks"
type = "shell"
run = "sh .vago/scripts/check.sh"

[[steps]]
id = "merge"
name = "Squash merge"
type = "shell"
run = "sh .vago/scripts/merge.sh"
