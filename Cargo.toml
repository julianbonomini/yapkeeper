[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
jiff = "0.2"
serde_json = "1.0"
tempfile = "3.27"
unicode-width = "0.2"
yapkeeper-claude = { path = "crates/yapkeeper-claude" }
yapkeeper-model = { path = "crates/yapkeeper-model" }
